name: pages

# Builds and publishes https://book.ozarland.com/: the book told as LUMO's crossing
# of the archipelago of control. tools/site/build.py converts chapters/ and
# appendices/ with pandoc, word for word, frames each page with the story of
# story/story.json and the assets of site/, and checks that the published text
# equals the book and that every link resolves. Pull requests build and check;
# main also deploys. The custom domain is set in Settings, Pages (GitHub Pages
# ignores a CNAME file when a workflow deploys).

on:
  push:
    branches: [main]
    paths:
      - "chapters/**"
      - "appendices/**"
      - "assets/**"
      - "site/**"
      - "story/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # The organization requires actions pinned to a full commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pandoc
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends pandoc
          pandoc --version | head -n 1
      - name: Build the site, check the text and the links
        run: python3 tools/site/build.py --out build/site
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
